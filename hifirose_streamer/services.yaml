# HiFi Rose Streamer custom services

mute:
  name: Mute toggle
  description: Toggle mute on the HiFi Rose Streamer. Sets volume to 0 when muting, restores previous volume when unmuting.
  target:
    entity:
      integration: hifirose_streamer
      domain: media_player
  fields:
    entity_id:
      name: Entity
      description: The HiFi Rose Streamer entity to mute/unmute.
      required: true
      example: "media_player.hifi_rose_streamer"
      selector:
        entity:
          integration: hifirose_streamer
          domain: media_player

switch_to_streamer:
  name: Switch to STREAMER
  description: Switch the HiFi Rose Streamer input source to STREAMER (built-in streaming).
  target:
    entity:
      integration: hifirose_streamer
      domain: media_player
  fields:
    entity_id:
      name: Entity
      description: The HiFi Rose Streamer entity to control.
      required: true
      example: "media_player.hifi_rose_streamer"
      selector:
        entity:
          integration: hifirose_streamer
          domain: media_player

